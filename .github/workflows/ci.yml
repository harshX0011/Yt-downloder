name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "vendor/**"
  pull_request:
    paths-ignore:
      - "vendor/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  docker:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t authorized-media-downloader:ci .

      - name: Smoke test the running container
        run: |
          docker run -d --name amd -p 8000:8000 authorized-media-downloader:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/policy > /dev/null
          curl -fsS http://127.0.0.1:8000/ > /dev/null
          docker rm -f amd
